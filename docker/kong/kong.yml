_format_version: '2.1'
_transform: true

# Passerelle d'API de la pile Supabase auto-hébergée.
# Kong est le seul point d'entrée des services internes : l'application
# n'appelle jamais GoTrue, PostgREST ou Realtime directement.

consumers:
  - username: anon
    keyauth_credentials:
      - key: $ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SERVICE_ROLE_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  # Authentification — ouvert (la clé anon suffit à demander un jeton)
  - name: auth-v1-open
    url: http://auth:9999/
    routes:
      - name: auth-v1-open
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors

  # Administration des comptes — réservée à la clé de service
  - name: auth-v1-admin
    url: http://auth:9999/admin/
    routes:
      - name: auth-v1-admin
        strip_path: true
        paths:
          - /auth/v1/admin/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin

  # API REST sur les tables du schéma public (les politiques RLS
  # s'appliquent en fonction du jeton porté par la requête)
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  # Diffusion temps réel des notifications
  - name: realtime-v1-ws
    url: http://realtime:4000/socket
    protocol: http
    routes:
      - name: realtime-v1-ws
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  # Fonctions Edge (envoi des courriels de notification)
  - name: functions-v1
    url: http://functions:9000/
    routes:
      - name: functions-v1-all
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: cors
