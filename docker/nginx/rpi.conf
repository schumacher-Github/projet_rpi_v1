# Frontal de la plateforme RPI-PAD.
#
# Deux règles seulement : tout ce qui commence par un préfixe de la pile
# Supabase part vers Kong, le reste part vers l'application. Le certificat
# attendu est celui de l'autorité interne du Port Autonome de Douala,
# déposé dans docker/nginx/certs/ (voir DEPLOIEMENT.md).

# Nginx ne résout les noms d'un bloc « upstream » qu'une seule fois, au
# démarrage. Or Docker réattribue les adresses IP à chaque recréation d'un
# conteneur : après un « up --build » de l'application, Nginx continuait
# d'écrire vers l'ancienne adresse — devenue celle d'un autre service, d'où
# des réponses 404 venues de GoTrue au lieu de l'application. Les adresses
# sont donc résolues à chaque requête, par le DNS interne de Docker.

# Ne déclare « Connection: upgrade » que pour les vraies requêtes WebSocket
# (le temps réel) ; les autres gardent une connexion ordinaire.
map $http_upgrade $rpi_connexion {
  default upgrade;
  ''      close;
}

# Redirection de tout le trafic en clair
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/rpi-pad.crt;
  ssl_certificate_key /etc/nginx/certs/rpi-pad.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  # En-têtes de sécurité
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  client_max_body_size 20m;

  # DNS interne de Docker, avec une durée de validité courte.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $rpi_app http://app:3000;
  set $rpi_api http://kong:8000;

  # Pile Supabase (authentification, API REST, temps réel, fonctions)
  location ~ ^/(auth|rest|realtime|functions|storage)/v1/ {
    proxy_pass         $rpi_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $rpi_connexion;
    proxy_read_timeout 3600s;
  }

  # Application (rendu côté serveur et fichiers statiques)
  location / {
    proxy_pass         $rpi_app$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $rpi_connexion;
    proxy_read_timeout 60s;
  }
}
